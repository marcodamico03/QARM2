# Settings of the app (step 5).

[client]
toolbarMode = "minimal"        # no "Deploy" button and no developer menu: the app as a client sees it

[server]
runOnSave = true               # the app reloads by itself when a file is saved

[theme]                        # colours of the widgets, the same as src/theme.py (also in dark mode)
base = "light"
primaryColor = "#5B2A86"
backgroundColor = "#F3F2F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#221F33"
