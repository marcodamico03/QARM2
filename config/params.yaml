# Shared parameter file.
# Every module reads its settings from here, so the three phases and the
# backtest always use the same assumptions. Values marked TODO are placeholders
# to be decided by the group.

data:
  start_date: "2000-01-01"   # early start so 2008 is out-of-sample (first 60-month window ends ~2005)
  base_currency: "CHF"
  frequency: "monthly"       # all returns are month-end to month-end
  folder: "data"             # saved copies, so the app works offline
  max_abs_monthly_return: 0.60   # cleaning: any |monthly return| above this is flagged as a data error

  # ---------------------------------------------------------------------------
  # Investable universe (proposal, section 3.2).
  # Each asset has an ordered list of sources. The FIRST source is the investable
  # one (ETF or stock); the following ones are long-history proxies used only for
  # the months before the first source exists ("splicing").
  # Every series is converted to CHF. Proxies are documented in the coverage report.
  # ---------------------------------------------------------------------------
  assets:
    world_equity:
      label: "World equities"
      sources:
        - {type: yahoo, tickers: ["URTH"], currency: USD}            # iShares MSCI World (from 2012)
        - {type: kf_market, file: "Developed_3_Factors", currency: USD}   # Ken French developed markets (from 1990)
    euro_banks:
      label: "European banks (banker's sector)"
      sources:
        - {type: yahoo, tickers: ["EXV1.DE"], currency: EUR}         # iShares STOXX Europe 600 Banks
        # Longer European history, tried in this order before falling back to US banks.
        # If Yahoo has no older data for a ticker, it is skipped automatically.
        - {type: yahoo, tickers: ["EXX1.DE"], currency: EUR}         # iShares EURO STOXX Banks 30-15
        - {type: yahoo, tickers: ["^SX7E"], currency: EUR}           # EURO STOXX Banks index (price only, no dividends)
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Banks", currency: USD}  # last resort: US banks
    swiss_equity:
      label: "Swiss equities"
      sources:
        - {type: yahoo, tickers: ["EWL"], currency: USD}             # iShares MSCI Switzerland (from 1996)
    chf_bonds:
      label: "CHF government bonds"
      sources:
        # The SNB changed its yield methodology in July 2025: the old cube stops on 2025-07-31.
        # New cube first; the old one fills the months before the new one starts.
        - {type: snb_yield, cube: "rendeiduebd", code: "10J", dim_sel: "D0(CHF),D1(10J)", duration: 8.0}   # 2025 methodology
        - {type: snb_yield, cube: "rendoblim", code: "10J", duration: 8.0}   # 2002 methodology, up to July 2025
    global_bonds_hedged:
      label: "Global bonds (US Treasuries, hedged to CHF)"
      sources:
        - {type: fred_yield, series: "DGS10", duration: 8.0, currency: USD, hedged: true, foreign_rf: "DTB3"}   # daily series, month-end value
    swiss_real_estate:
      label: "Swiss real estate"
      sources:
        - {type: yahoo, tickers: ["PSPN.SW", "SPSN.SW", "ALLN.SW"], currency: CHF}   # equal-weight basket of listed property companies
    gold:
      label: "Gold"
      sources:
        - {type: yahoo, tickers: ["GLD"], currency: USD}             # SPDR Gold (from 2004)
        - {type: yahoo, tickers: ["GC=F"], currency: USD}            # gold futures (from 2000)
    employer_stock:
      label: "Employer stock (UBS)"
      sources:
        - {type: yahoo, tickers: ["UBSG.SW"], currency: CHF}
        - {type: yahoo, tickers: ["UBS"], currency: USD}             # NYSE listing, longer history

  # Which asset plays which role in the career model (proposal, section 3.1)
  career_bond_asset: "chf_bonds"     # R_B
  career_sector_asset: "euro_banks"  # R_S

  # ---------------------------------------------------------------------------
  # Rates and exchange rates
  # ---------------------------------------------------------------------------
  rates:
    chf_rf: {type: snb_rate, cube: "zimoma", code: "SARON"}   # CHF risk-free rate (annual %, can be negative)
  fx:                                   # FRED daily series, month-end value
    USDCHF: "DEXSZUS"                   # CHF per 1 USD
    EURUSD: "DEXUSEU"                   # USD per 1 EUR  (EURCHF = USDCHF x EURUSD)

client:                      # default persona: the Zurich banker
  age: 35
  retirement_age: 65
  salary_chf: null           # TODO
  portfolio_chf: 100000
  pension_chf: null          # TODO

career:
  beta_bond: null            # TODO (can be above 1 because of duration)
  beta_sector: null          # TODO (choose a conservative value)

optimization:
  gamma: null                # TODO: calibrate so a no-career client holds 60/40
  long_only: true
  max_leverage: 1.0

backtest:
  window_months: 60
  transaction_cost_bp: 10
  job_loss_threshold: 0.30   # tested from 0.20 to 0.40
